server:
  port: 8080

spring:
  application:
    name: inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # HS256 に必要な 256bit 以上の秘密鍵（環境変数で上書き推奨）
    secret: ${JWT_SECRET:inventory-management-system-jwt-secret-key-0123456789abcdef}
    expiration-ms: 3600000
