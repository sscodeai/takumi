server:
  port: 0

spring:
  application:
    name: inventory
  datasource:
    url: jdbc:h2:mem:inventory_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: inventory-management-system-jwt-secret-key-0123456789abcdef
    expiration-ms: 3600000
