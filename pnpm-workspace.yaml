# Workspace members.
#
# runtimes/pi is deliberately NOT a workspace member: it integrates with the
# unpublished `@earendil-works/pi-coding-agent` SDK as an optional peer
# dependency. Including it here would make workspace installs depend on a
# private SDK that most users cannot access.
#
# Takumi's installable core is therefore: packages/* + apps/* + runtimes/fake +
# runtimes/cli + runtimes/deepseek. The Pi runtime is opt-in:
#   cd runtimes/pi && pnpm install && pnpm build
# (on a machine that has the Pi SDK configured). The rest of Takumi builds and
# runs without it — see README "Installable without the Pi runtime".
packages:
  - "packages/*"
  - "apps/*"
  - "runtimes/fake"
  - "runtimes/cli"
  - "runtimes/deepseek"
# Task-board providers (ADR-006). They depend on @takumi/core only — the
# request seam is injected, so no adapter needs a network client or a token
# to build or to run its tests. A glob on purpose: adding a board is one new
# directory, not an edit to every workspace file.
  - "boards/*"
