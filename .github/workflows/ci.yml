name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (sequential workspace build)
        run: pnpm build
      - name: Test (all packages)
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  # Real Pi runtime integration is gated on OPENCODE_GO_API_KEY (secret).
  pi-integration:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ secrets.OPENCODE_GO_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pi runtime smoke
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: node scripts/pi-smoke.mjs