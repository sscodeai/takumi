name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (sequential workspace build)
        run: pnpm build
      - name: Test (all packages)
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  # HAS `main` BEEN LEFT BEHIND? (ledger #94)
  #
  # On 2026-10-20 `main` was 131 commits — fourteen days, five ledgers of fixes — behind `dev`, and
  # nothing was broken, which is why nobody noticed. The cost is paid at release time, when "merge dev
  # into main" is a 10,000-line review nobody reads.
  #
  # `fetch-depth: 0` is required: the default shallow clone has no history to count commits over, and a
  # check that cannot see the history must FAIL rather than report zero (the script exits 2 for that).
  # `continue-on-error` is deliberately NOT set: this is advisory in WHAT it measures (a distance, not a
  # verdict on the commits) but it is still a fact the branch should not be allowed to hide.
  main-lag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Has main been left behind by dev?
        run: |
          git fetch --quiet origin main dev
          bash scripts/check-main-lag.sh --max 40

  # The Pi runtime smoke test (scripts/pi-smoke.mjs) is intentionally NOT a CI job:
  #
  #   * runtimes/pi is not a pnpm workspace member (it depends on the unpublished
  #     @earendil-works/pi-coding-agent SDK), so `pnpm install` / `pnpm build` at the
  #     repo root never produce runtimes/pi/dist, and the smoke script cannot resolve
  #     its import on a clean checkout.
  #   * GitHub never exposes the `secrets` context in `jobs.<job_id>.if` — only
  #     github/needs/vars/inputs are allowed there. The previous
  #     `if: ${{ secrets.OPENCODE_GO_API_KEY != '' }}` made the whole workflow file
  #     invalid, so every run failed before creating a single job.
  #
  # Run the Pi integration check locally instead:
  #   cd runtimes/pi && pnpm install && pnpm build
  #   cd ../.. && OPENCODE_GO_API_KEY=... node scripts/pi-smoke.mjs
