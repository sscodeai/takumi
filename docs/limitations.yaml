# Named limitations of the unattended chain — MACHINE-READ, not a journal.
#
# Why this file exists: limitations used to be stated only in prose (an ADR's "Named limitations"
# section, a ledger row). Prose rots in BOTH directions: a limitation that has been closed sits
# there looking current, and a limitation stated in an ADR need not appear anywhere a machine reads.
# The test beside this file enforces the three rules that make it an inventory:
#
#   1. every entry names WHERE it is stated, and that text really is there;
#   2. every entry states when it CLOSES (a limitation nobody can close is a design, not a gap);
#   3. an entry whose `closes_when_path` EXISTS must be DELETED — a closed limitation left in the
#      list is a lie in the other direction.
#
# Shapes borrowed from a spec-suite repository (mechanism only: that repository carries NO licence
# at all, so not one line of its code may be taken): a known-defect list a TEST consumes, and a
# pass / fail / UNSUPPORTED third state.

limitations:
  - id: ci-cannot-verify-the-boundary
    what: >-
      GitHub-hosted runners refuse unprivileged user namespaces, so the boundary's kernel tests skip
      in CI: a green CI says nothing about the boundary.
    where:
      file: docs/adr/058-a-delivery-runs-inside-a-boundary.md
      contains: "## What CI cannot verify"
    closes_when: >-
      a CI runner grants unprivileged user namespaces (the tests then stop skipping, and the skip
      becomes a failure).

  - id: deliverable-can-read-the-platform
    what: >-
      The acceptance step's subject — the delivered project — runs inside the read-only-platform
      boundary: it cannot WRITE this repository, but it can READ it.
    where:
      file: docs/adr/058-a-delivery-runs-inside-a-boundary.md
      contains: "still READ it — the platform is mirrored for that step, not hidden"
    closes_when: >-
      the platform is hidden from the acceptance harness without hiding the harness's own scripts —
      the shape that produced ledger #75.

  - id: intake-reliability
    what: >-
      The intake is REPAIRED, not made reliable. Measured 2026-10-29 over three unattended runs of
      three different request shapes (a pass percentage, an aggregate, a pair of counts): the FIRST
      attempt passed its own shape gate in 1 of 3, and 2 of 3 delivered — both the failures were
      caught by the gate and fixed by the repair round, which is the repair working, not the intake
      being reliable. The failures were not the same defect twice: one document omitted the
      `checkedAs:` a `derived-ratio` decision needs, the other declared no `deliverable.run` at all
      and zero requirements. A first-attempt rate of 1/3 means an unattended run costs roughly three
      attempts' worth of tokens and time for two of every three requests.
    where:
      file: docs/adr/057-the-intake-is-repaired-not-thrown-away.md
      contains: "repaired"
    closes_when: >-
      the first attempt produces a confirmable document at a measured rate the operator accepts —
      measured with `scripts/measure-intake-rate.sh`, and the operator names the rate.

  - id: derived-ratio-proves-arithmetic-not-meaning
    what: >-
      The `derived-ratio` check proves each printed ratio equals its OWN numerator and denominator. It
      does not verify that the two counts mean what the document says they mean, so a document that
      mislabels what it divides still passes.
    where:
      file: docs/adr/061-a-ratio-is-not-a-mean.md
      contains: "It does not verify the denominator's meaning"
    closes_when: >-
      the relation is extended to derive the counts from the declared input world instead of reading both
      sides of the division from the report.

  - id: a-ratio-report-cannot-declare-count-relations
    what: >-
      A ratio report cannot declare `additivity`, `duplicate-resolution`, `malformed-row-accounting` or
      `independent-aggregation`, even when the property is genuinely true of it. Those four are
      implemented by recomputing counts and sums from the records and requiring them ON THE LINE
      (`additivity` sums count/sum roles across the per-id and totals lines; the others compare against
      `check_report`/`aggregate`), and a ratio line carries no such roles. So the CHECK is unavailable,
      not the property untrue. `row-order-invariance` used to be in this list and is NOT any more —
      see ledger #110: its check is two runs and a comparison and needs no roles at all.
    where:
      file: extensions/judges/metamorphic-forge.sh
      contains: "recomputes COUNTS or SUMS from the fixture"
    closes_when: >-
      the four relations are implemented for a ratio line as well — recomputing from the shuffled or
      duplicated fixture and comparing the printed RATIO, rather than looking for count/sum roles the
      line does not have. Until then the intake prompt must keep telling the model to drop them, and a
      human reading the document must know the omission is a judge limitation and not a claim that the
      report lacks the property.

  - id: the-sandbox-writability-test-assumes-a-stricter-host
    what: >-
      `packages/core/src/test/sandbox.test.ts` — "project dir is writable, host outside is read-only" —
      FAILS on the development host (measured 2026-10-29, kernel 6.1.0-44-amd64, uid 999) and passes in
      CI. The test asserts that a write to a path outside the project directory is refused inside the
      `unshare` boundary; on this host `unshare -r -n bash -c 'echo test > /tmp/x'` SUCCEEDS, so the
      assertion `1 !== 0`. The boundary the chain relies on is therefore weaker on this machine than the
      test's model of it — that is a real observation about the host, not a test that needs loosening.
      It is recorded rather than skipped because a skipped test reads as "not applicable", and this one
      is applicable: it is simply failing.
    where:
      file: packages/core/src/test/sandbox.test.ts
      contains: "project dir is writable, host outside is read-only"
    closes_when: >-
      either the host's user namespaces are configured so the assertion holds (and the test goes green
      on this machine), or the test is rewritten to detect the boundary the host actually provides and
      to fail only when the project directory itself is unprotected — in which case the weaker
      outside-write protection must be stated in docs/limitations.yaml as its own entry.

  - id: the-mutation-harness-can-be-judged-before-it-exists
    what: >-
      A delivery step can be judged while the files it declares are not yet in the worktree. Measured
      2026-11-03 on run `wf-0a7781cf`: the judge invoked `bash run-mutation.sh` as the document's
      `mutation.run` declares and got `exit 127` (command not found), aborting the delivery on
      `REL-002`. The same command, run by hand in that worktree afterwards — and under `unshare -r -n`,
      and under `sh -c` exactly as the judge invokes it — succeeds: 18 mutants measured, 0 survivors.
      So the acceptance verdict described a worktree state that no longer existed by the time it was
      read. Nothing incorrect landed (the relation failed closed, which is the right direction), but a
      run that had in fact produced the file was lost.
    where:
      file: docs/measurements/second-request-on-a-busy-repository-2026-11-03.md
      contains: "exit 127"
    closes_when: >-
      the acceptance step either reads the worktree at a pinned commit and says which one (so the
      verdict names the tree it judged), or the delivery step cannot reach acceptance until every path
      its document declares under `mutation.run` / `deliverable.run` exists in the worktree — and a
      real run shows the mutation relation passing without a later manual re-run.
