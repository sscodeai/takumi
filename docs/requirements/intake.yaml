requirements:
  - id: REQ-001
    title: "Provide the summary.sh entry point"
    description: "The deliverable is a command-line tool invoked as `bash summary.sh <csv>` from the repository root, where `<csv>` is the path to the input file and is passed as `$1`. The tool reads that file, writes its report to standard output and exits 0 for a readable file."
    acceptance_criteria:
      - "`bash summary.sh <fixture.csv>` exits 0 and writes the report to standard output."
      - "The file read is exactly the path given as `$1`; no other input path or environment variable is required."
    priority: High
    source: "small command-line tool that reads a CSV of daily station temperatures"

  - id: REQ-002
    title: "Aggregate by station"
    description: "For every distinct station id that appears in at least one valid row, the tool prints exactly one station line reporting the count of valid rows, the minimum, the maximum and the mean of temperature_c. min, max and mean are printed with exactly four digits after the decimal point."
    acceptance_criteria:
      - "Each distinct station id with at least one valid row produces exactly one station line."
      - "count equals the number of valid rows for that station."
      - "min and max are the smallest and largest temperature_c among that station's valid rows."
      - "mean is the arithmetic mean of that station's valid temperatures, formatted with exactly four digits after the decimal point."
    priority: High
    source: "prints one line per station with the count, minimum, maximum and mean temperature"

  - id: REQ-003
    title: "Use the exact station line shape"
    description: "Each station line has the exact shape `<station> <count> <min> <max> <mean>` with single-space separators, where the positional fields are id, count, min, max and mean in that order."
    acceptance_criteria:
      - "Every station line matches the shape `<station> <count> <min> <max> <mean>` with single spaces between fields."
      - "The five fields appear in the order id, count, min, max, mean."
    priority: High
    source: "one line per station with the count, minimum, maximum and mean"

  - id: REQ-004
    title: "Skip and count malformed rows"
    description: "A row is malformed when it does not contain exactly three comma-separated fields, when its temperature_c field is not numeric, or when its station field is empty. Malformed rows are excluded from every aggregate, and the tool reports how many rows it skipped on a dedicated line."
    acceptance_criteria:
      - "A row with a missing field, an empty station or a non-numeric temperature does not contribute to any station aggregate."
      - "The tool prints exactly one `SKIPPED <skipped-count>` line whose number equals the number of malformed rows in the input."
    priority: High
    source: "skipping malformed rows and reporting how many it skipped"

  - id: REQ-005
    title: "Print one totals line"
    description: "The tool prints exactly one totals line of the shape `TOTAL <count>`, where count is the total number of valid rows that contributed to the station lines."
    acceptance_criteria:
      - "Exactly one `TOTAL <count>` line is printed."
      - "The TOTAL count equals the sum of the counts printed on all station lines."
    priority: High
    source: "deliverable contract requiring exactly one totals line"

  - id: REQ-006
    title: "Emit deterministic station ordering"
    description: "Station lines are printed in ascending lexicographic order of station id, so the reported values and their order do not depend on the order of the input rows."
    acceptance_criteria:
      - "Station lines are ordered by station id ascending."
      - "Two runs over row-shuffled copies of the same rows produce byte-identical standard output."
    priority: Medium
    source: "one line per station, produced reproducibly so it can be checked independently"

  - id: REQ-007
    title: "Ship an automated test suite"
    description: "The project ships an automated test suite exercising valid aggregation, malformed-row handling and repeated station ids. The suite is run by the workflow test command; no judge relation in this document mechanises it."
    acceptance_criteria:
      - "The repository contains a runnable automated test suite covering valid aggregation, malformed rows and duplicate station ids."
      - "The suite passes on the delivered implementation."
    priority: Medium
    source: "engineering expectation for an independently checked deliverable"

ambiguities:
  - id: AMB-001
    question: "What does the tool do with a malformed row?"
    options:
      - "skip-count: skip the malformed row, exclude it from the aggregates and add it to a reported skipped count"
      - "skip-silent: skip the malformed row and report no skipped count"
      - "stop-error: abort on the first malformed row with a non-zero exit code"
    default: "skip-count: skip the malformed row, exclude it from the aggregates and add it to a reported skipped count"
    checkedAs: skip-count
    blocking: true

    chosen: "skip-count: skip the malformed row, exclude it from the aggregates and add it to a reported skipped count"
  - id: AMB-002
    question: "When the same station id appears on more than one valid row, how are those rows resolved?"
    options:
      - "merge: every valid row for the station contributes to one combined aggregate"
      - "last-row: only the last valid row for the station is kept and counted"
      - "first-row: only the first valid row for the station is kept and counted"
      - "error: a repeated station id is a hard failure"
    default: "merge: every valid row for the station contributes to one combined aggregate"
    checkedAs: merge
    blocking: true

    chosen: "merge: every valid row for the station contributes to one combined aggregate"
  - id: AMB-003
    question: "How is a mean that does not fit four decimal places rounded?"
    options:
      - "half-up: round half away from zero at the fourth decimal place"
      - "truncate: drop everything after the fourth decimal place"
    default: "half-up: round half away from zero at the fourth decimal place"
    checkedAs: half-up
    blocking: true

    chosen: "half-up: round half away from zero at the fourth decimal place"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 60000
  input_format:
    columns: "date:date,station:id,temperature_c:measure"
    sample: |
      2024-01-01,ALPHA,10.4
      2024-01-01,BRAVO,-2.5
      2024-01-02,ALPHA,11.6
      2024-01-02,BRAVO,0.0
  output_format:
    station_line:
      shape: "<station> <count> <min> <max> <mean>"
      fields: [id, count, min, max, mean]
    skipped_line:
      shape: "SKIPPED <skipped-count>"
      fields: [skipped-count]
    total_line:
      shape: "TOTAL <count>"
      fields: [count]
  relations:
    - id: REL-001
      relation: malformed-row-accounting
      decides: AMB-001
      description: "A malformed row is handled the way AMB-001 decided, and the skipped-count line reports the number of rows handled that way."
    - id: REL-002
      relation: additivity
      description: "The counts on the station lines sum to the count on the TOTAL line."
    - id: REL-003
      relation: duplicate-resolution
      decides: AMB-002
      description: "Rows that repeat a station id are resolved the way AMB-002 decided before the aggregate is computed."
    - id: REL-004
      relation: row-order-invariance
      description: "Shuffling the input rows leaves the standard output byte-identical."
  differential:
    - id: DIFF-001
      anchor: independent-aggregation
      decides: AMB-003
      description: "An independent recomputation of count, min, max and mean, rounding the mean the way AMB-003 decided, reproduces every station line and the TOTAL line."
