requirements:
  - id: REQ-001
    title: "Provide the summary.sh entry point"
    description: "The deliverable is a command-line entry point script named summary.sh at the repository root. It reads the CSV file whose path is passed as the first positional argument ($1) and writes the station summary to standard output. The contract invocation is exactly: bash summary.sh <csv>."
    acceptance_criteria:
      - "A file named summary.sh exists at the repository root."
      - "Running bash summary.sh <path-to-csv> reads that CSV, writes the summary to stdout, and exits 0."
      - "The input path is taken from $1; no interactive input, flag, or environment variable is required."
    priority: High
    source: "the incoming request: a small command-line tool that reads a CSV of daily station temperatures and prints one line per station"

  - id: REQ-002
    title: "Print one aggregate line per station"
    description: "For every station id present in the valid rows, the tool prints exactly one line of the shape <station> <count> <min> <max> <mean>. count is how many valid rows were aggregated for that station, min and max are the smallest and largest temperature_c among those rows, and mean is their arithmetic average. Numeric fields are printed with exactly two decimal places."
    acceptance_criteria:
      - "Each distinct station id among the valid rows appears on exactly one line."
      - "The five fields of a station line are separated by single spaces and appear in the order id, count, min, max, mean."
      - "For a fixture with known values, min and max equal the extreme temperature_c of that station and mean equals the average of its temperatures rounded to two decimals."
    priority: High
    source: "the incoming request: prints one line per station with the count, minimum, maximum and mean temperature"

  - id: REQ-003
    title: "Print exactly one totals line"
    description: "After the station lines the tool prints exactly one totals line of the shape TOTAL <count>, where count is the number of valid rows aggregated, that is the sum of the per-station counts. Skipped rows are excluded from this count and are reported separately on the SKIPPED line."
    acceptance_criteria:
      - "Exactly one TOTAL line is printed per run."
      - "The number on the TOTAL line equals the sum of the counts on the station lines."
    priority: High
    source: "derived: the request asks for a whole against which the per-station parts and the skipped rows can be checked"

  - id: REQ-004
    title: "Skip malformed rows and report how many were skipped"
    description: "A malformed row is not aggregated. It is skipped, and the tool prints exactly one line of the shape SKIPPED <n> where n is the number of malformed rows encountered. Skipping a malformed row is not an error: the process still exits 0."
    acceptance_criteria:
      - "For a fixture with N malformed rows and M valid rows, the tool prints SKIPPED N and aggregates exactly the M valid rows."
      - "The sum of the per-station counts plus the skipped count equals the number of data rows in the input."
      - "The process exits 0 even when malformed rows were skipped."
    priority: High
    source: "the incoming request: skipping malformed rows and reporting how many it skipped"

  - id: REQ-005
    title: "Define which rows are malformed"
    description: "A data row is malformed when it does not split into exactly three comma-separated fields, when its station field is empty, or when its temperature_c field is not parseable as a number (including empty). A row whose date field is empty or not a calendar date but whose station is non-empty and whose temperature is numeric is still valid; the date column is carried in the input but is not validated and does not affect aggregation."
    acceptance_criteria:
      - "A blank line, a row with a wrong number of fields, a row with an empty station, and a row with a non-numeric temperature are each counted as malformed."
      - "A row with a non-empty station and a numeric temperature but an empty or non-date date field is aggregated, not skipped."
    priority: Medium
    source: "derived: the request says malformed rows but does not define malformed"

  - id: REQ-006
    title: "Make the report independent of input row order"
    description: "The printed summary depends only on the set of valid rows, not on the order in which the rows appear in the input file. Station lines are emitted in ascending lexicographic order of station id."
    acceptance_criteria:
      - "Running the tool on a fixture and on a shuffled permutation of the same rows produces byte-identical output."
    priority: Medium
    source: "derived: the request does not fix an output order"

  - id: REQ-007
    title: "Fail loudly when the input cannot be read"
    description: "If the CSV path is missing, unreadable, or names a directory, the tool writes a diagnostic message to standard error and exits with a non-zero status. This failure mode is not mechanised by any relation in this document."
    acceptance_criteria:
      - "Running the tool with a path that does not exist exits non-zero and writes a message to stderr."
    priority: Low
    source: "derived: robustness of the command-line entry point"

ambiguities:
  - id: AMB-001
    question: "What happens to a row that cannot be parsed?"
    options:
      - "skip-count: skip the row, do not aggregate it, and count it on the SKIPPED line"
      - "skip-silent: skip the row and do not report it anywhere"
      - "stop-error: stop with a non-zero exit as soon as a malformed row is seen"
    default: "skip-count: skip the row, do not aggregate it, and count it on the SKIPPED line"
    checkedAs: skip-count
    blocking: true
  - id: AMB-002
    question: "When the same station id appears on several rows, how are those rows aggregated?"
    options:
      - "merge: every valid row is its own reading, and all rows of the id form one aggregate"
      - "last-row: only the last row seen for the id is kept"
      - "first-row: only the first row seen for the id is kept"
      - "error: a repeated station id is a hard failure"
    default: "merge: every valid row is its own reading, and all rows of the id form one aggregate"
    checkedAs: merge
    blocking: true
  - id: AMB-003
    question: "How does a non-terminating mean round when the summary is recomputed independently?"
    options:
      - "half-up: round half away from zero to two decimal places"
      - "truncate: drop everything after the second decimal place"
    default: "half-up: round half away from zero to two decimal places"
    checkedAs: half-up
    blocking: true
  - id: AMB-004
    question: "In what order are the station lines printed?"
    options:
      - "alphabetical: ascending lexicographic order of station id"
      - "first-appearance: the order in which each station id first occurs in the input"
    default: "alphabetical: ascending lexicographic order of station id"
    blocking: true

deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 60000
  input_format:
    columns: "date:date,station:id,temperature_c:measure"
    sample: |
      2024-01-01,ALPHA,10.4
      2024-01-01,BRAVO,-2.5
      2024-01-02,ALPHA,11.6
      2024-01-03,BRAVO,0.0
  output_format:
    station_line:
      shape: "<station> <count> <min> <max> <mean>"
      fields: [id, count, min, max, mean]
    skipped_line:
      shape: "SKIPPED <skipped>"
      fields: [skipped-count]
    total_line:
      shape: "TOTAL <count>"
      fields: [count]
  relations:
    - id: REL-001
      relation: malformed-row-accounting
      decides: AMB-001
      description: "A malformed row is skipped and counted on the SKIPPED line the way AMB-001 decided, and skipped rows never reach the per-station aggregates."
    - id: REL-002
      relation: additivity
      description: "The counts on the station lines sum to the count on the TOTAL line the tool itself printed."
    - id: REL-003
      relation: duplicate-resolution
      decides: AMB-002
      description: "A station id repeated across rows resolves the way AMB-002 decided: all of its valid rows merge into one aggregate."
    - id: REL-004
      relation: row-order-invariance
      decides: AMB-004
      description: "A shuffled permutation of the same input rows produces the same station lines, in the same order, as the original input."
  differential:
    - id: DIFF-001
      anchor: independent-aggregation
      decides: AMB-003
      description: "An independent recomputation of count, min, max and half-up mean for each station matches the tool's printed station lines, and an independent count of malformed rows matches the SKIPPED line."
