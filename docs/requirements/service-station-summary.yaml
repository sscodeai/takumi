# The requirement document for the NON-SCRIPT shape: an HTTP SERVICE that summarises the station CSV.
#
# This is the artefact a human confirms and the acceptance step binds to: its digest is the
# confirmation token. The raw request it was derived from is docs/requests/station-temperature-service.md.
#
# WHY THIS DOCUMENT EXISTS. Every delivery the black-box chain has ever produced is a SCRIPT: one file,
# invoked once, prints to stdout and exits. This document asks for the OTHER shape — a long-running
# service with a JSON endpoint — and what the live spike found is what ADR-046 records: a service-shaped
# delivery needs a BOUND on the invocation (a start-and-serve `run` never exits) and a scenario that
# ASSERTS something about the response (otherwise a command that merely reaches the surface passes
# whatever the surface said).
#
# A first draft of this document also declared `deliverable.build` and `deliverable.tests`, on the theory
# that a service has no single-file entry point to guess. Nothing in the chain reads either key — the
# delivered project's own tests are run from the WORKFLOW's `testCommand`, and no install/build step
# exists at all — so they are now REFUSED rather than silently ignored (a declaration that is never
# executed reads as compliance, which is worse than a refusal). They are gone from this document, and
# REQ-002 below says what actually holds instead.
#
# The `deliverable` block is the contract a JUDGE is forged against (ADR-026). `run` is how the thing is
# invoked and `timeoutMs` bounds ONE invocation of it (ADR-046); `input_format` is the world a judge
# builds fixtures in (ADR-033); `output_format` is the shape a judge may parse; `relations`/`differential`
# are the invariants a judge must check; and a `scenarios` entry is a check the document declares
# (ADR-035) — the ONLY mechanism in the chain that STARTS a surface, waits for a URL and asserts what the
# surface answers with.

requirement:
  id: REQ-DOC-002
  title: Station temperature summary HTTP service
  source: docs/requests/station-temperature-service.md

requirements:
  - id: REQ-001
    title: "Expose the summary as a JSON endpoint"
    description: >
      The deliverable is an HTTP service that serves the per-station summary as JSON. It is started
      (not invoked once per file) and reached over HTTP on localhost; a request to the summary endpoint
      returns a JSON body carrying, for every station with at least one valid reading, the count, the
      minimum, the maximum and the mean temperature_c rounded to one decimal place, plus the overall
      valid-reading count.
    acceptance_criteria:
      - "The service is started by a declared command and answers on a declared URL."
      - "The response body is JSON (not a printed text table)."
      - "Every station with at least one valid reading appears in the JSON response."
      - "The response carries the overall valid-reading count."
    priority: High
    source: "Request: 'a tiny HTTP service ... a JSON endpoint that summarises the station CSV'"
  - id: REQ-002
    title: "Declare how the service is started and how one invocation is bounded"
    description: >
      Because the deliverable is a service and not a script, the project must declare how it is STARTED
      and reached over HTTP, and the document must bound one invocation of that command — a
      start-and-serve command never exits on its own. The delivered project's own build and test steps
      are NOT part of this document: its tests are run by the workflow's `testCommand`, and declaring a
      `build` or `tests` command here would be a declaration nothing reads (ADR-046).
    acceptance_criteria:
      - "The deliverable declares how the service is started."
      - "The deliverable bounds one invocation of that command, so a command that never exits fails the check instead of hanging it."
      - "The document declares no `build` or `tests` key: the delivered project's tests are run from the workflow, not from this document."
    priority: High
    source: "Derived: a service has no single-file entry point to guess (ADR-046)"
  - id: REQ-003
    title: "Parse the daily temperature CSV"
    description: >
      The input is a CSV whose header names the columns date, station and temperature_c. A row is
      well-formed when it has three fields, a non-empty station id, a calendar-valid ISO date and a
      numeric temperature in degrees Celsius.
    acceptance_criteria:
      - "The header line is consumed and is not treated as a reading."
      - "Each well-formed row counts as exactly one reading for its station."
    priority: High
    source: "Request: 'reads a CSV export of daily temperature readings'"
  - id: REQ-004
    title: "Round to one decimal place, half away from zero"
    description: >
      The minimum, maximum and mean of each station are rendered with exactly one decimal place and
      rounded half away from zero (AMB-003).
    acceptance_criteria:
      - "min, max and mean each carry exactly one digit after the decimal point."
    priority: High
    source: "Request: 'with one decimal place'"
  - id: REQ-005
    title: "Account for malformed rows without crashing"
    description: >
      Rows that cannot be parsed never abort the service. Their handling is settled by AMB-001: with the
      default they are excluded from every aggregate and counted.
    acceptance_criteria:
      - "A fixture containing malformed rows is summarised to completion and the service stays up."
      - "Malformed rows never change a count, min, max or mean."
    priority: High
    source: "Request: 'Rows that cannot be parsed should be handled sensibly'"
  - id: REQ-006
    title: "Row-order-independent summary"
    description: "The summary depends only on the multiset of data rows, not on their order."
    acceptance_criteria:
      - "Permuting the data rows of a fixture yields the same summary."
    priority: High
    source: "Derived: a stable total requires order-independent aggregation"
  - id: REQ-007
    title: "Offline operation"
    description: "The service runs on a developer laptop with no network access and makes no outbound network calls."
    acceptance_criteria:
      - "The service produces the same summary with outbound networking unavailable."
    priority: Medium
    source: "Request: 'run on a developer laptop with no network access'"

ambiguities:
  - id: AMB-001
    question: "How are unparseable rows handled?"
    options:
      - "skip-count: skipped, excluded from every aggregate, and counted in the response"
      - "skip-silent: skipped silently with no count reported"
      - "stop-error: the first unparseable row fails the request"
    default: "skip-count: skipped, excluded from every aggregate, and counted in the response"
    checkedAs: skip-count
    blocking: true
    chosen: "skip-count: skipped, excluded from every aggregate, and counted in the response"
  - id: AMB-002
    question: "When the same (date, station) key appears more than once, what wins?"
    options:
      - "merge: each occurrence remains a separate valid reading and all contribute to the aggregate"
      - "first-row: only the first occurrence of a (date, station) key is kept"
      - "last-row: only the last occurrence of a (date, station) key is kept"
    default: "merge: each occurrence remains a separate valid reading and all contribute to the aggregate"
    checkedAs: merge
    blocking: true
    chosen: "merge: each occurrence remains a separate valid reading and all contribute to the aggregate"
  - id: AMB-003
    question: "How are values that are not exactly representable at one decimal place rounded?"
    options:
      - "half-up: round half away from zero"
      - "truncate: round toward zero, dropping extra digits"
    default: "half-up: round half away from zero"
    checkedAs: half-up
    blocking: true
    chosen: "half-up: round half away from zero"
  - id: AMB-004
    question: "In what order are the stations presented in the JSON response?"
    options:
      - "ascending station id, byte-wise lexicographic"
      - "order of first appearance in the input file"
      - "unspecified"
    default: "ascending station id, byte-wise lexicographic"
    blocking: false
    chosen: "ascending station id, byte-wise lexicographic"
  - id: AMB-005
    question: "What does the overall total count?"
    options:
      - "valid readings only: the sum of the per-station counts"
      - "all data lines including malformed ones"
    default: "valid readings only: the sum of the per-station counts"
    blocking: true

    chosen: "valid readings only: the sum of the per-station counts"
# The judge contract (ADR-026). A service is not "run once and exits": `run` starts it, the input world
# is the CSV it serves, and the ONLY check that can reach it is a declared scenario (ADR-035), which
# starts the surface, waits for the URL, ASSERTS what the document declares about the response
# (`expect_status`/`expect_body`, ADR-046) and runs a command against it.
deliverable:
  # HOW IT RUNS. A service is started, not invoked once per file — so this is the start command, and the
  # path the service should summarise is passed through the `{csv}` placeholder the judge resolves (in
  # `run` AND in a scenario's `start`, ADR-046).
  run: "bash serve.sh {csv}"
  # THE BOUND ON ONE INVOCATION (ADR-046). `bash serve.sh {csv}` starts the service and never exits, so
  # without a bound the judge waits for ever and the generated CI job waits out the host's own six-hour
  # limit. 120000 is the default; it is declared here so this document says the number out loud.
  timeoutMs: 120000
  # The world a judge builds its fixtures in (ADR-033).
  input_format:
    columns: "date:date,station:id,temperature_c:measure"
    sample: |
      2024-01-01,ALPHA,10.4
      2024-01-01,BRAVO,-2.5
      2024-01-02,ALPHA,11.6
      2024-01-02,BRAVO,-1.5
      2024-01-03,ALPHA,9.5
  # The JSON the endpoint answers with, declared as the line shapes a judge may parse: one JSON object
  # per station, one for the skipped count and one for the total.
  output_format:
    station_object:
      shape: '{"station":"<station>","count":<count>,"min":<min>,"max":<max>,"mean":<mean>}'
      fields: [id, count, min, max, mean]
    skipped_object:
      shape: '{"skipped":<skipped-count>}'
      fields: [skipped-count]
    total_object:
      shape: '{"total":<count>}'
      fields: [count]
  relations:
    - id: REL-001
      relation: row-order-invariance
      description: "Shuffling the input rows must not change any station's count, min, max or mean, nor the total."
    - id: REL-002
      relation: additivity
      description: "The per-station counts must sum to the total the service reports."
      decides: AMB-005
    - id: REL-003
      relation: duplicate-resolution
      description: "A fixture with repeated (date, station) rows is aggregated so every occurrence counts as its own reading."
      decides: AMB-002
    - id: REL-004
      relation: malformed-row-accounting
      description: "A fixture with unparseable rows is summarised without failing; the bad rows are excluded and counted."
      decides: AMB-001
  differential:
    - id: DIFF-001
      anchor: independent-aggregation
      description: "An independent re-computation of each station's count, min, max and mean, rounding half away from zero, must equal the service's JSON."
      decides: AMB-003
  # The check that actually reaches a SERVICE (ADR-035 + ADR-046): start the surface, wait for the URL,
  # ASSERT what the document declares about the response, run the command against it, then always kill
  # what was started. `expect_status`/`expect_body` are what stop this being a vacuous green: without one
  # of them the judge (and the front door) REFUSES the document, because a `run` that only has to exit 0
  # passes whatever the surface said.
  scenarios:
    - id: SCN-001
      # `{csv}` resolves to the fixture the judge generated from `input_format.sample`.
      start: "bash serve.sh {csv}"
      url: "http://127.0.0.1:8787/summary"
      run: "curl -fsS http://127.0.0.1:8787/summary"
      expect_status: 200
      expect_body: '"total"'
      expect: "the service starts, answers 200 on the declared URL, and returns a JSON summary of the sample CSV"
      timeoutMs: 60000
