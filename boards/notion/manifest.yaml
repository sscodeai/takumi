name: notion-board
kind: board
version: 0.1.0
description: A Notion database as the task board (a select/status property is the column, a rich-text property carries the versioned state record).
entry: dist/index.js
package: "@takumi/board-notion"
provider:
  factory: NotionBoardProvider
  transport: createNotionTransport
  auth:
    header: "Authorization: Bearer"
    env: NOTION_TOKEN
  api:
    base: https://api.notion.com/v1
    version_header: "Notion-Version: 2022-06-28"
    endpoints:
      queryDatabase: POST /databases/:database_id/query
      getPage: GET /pages/:page_id
      updatePage: PATCH /pages/:page_id
      createComment: POST /comments
capabilities:
  comments: true
  editableComment: false
  machineReadableState: true
  atomicClaim: false
  trustedAuthorFilter: false
  delivery:
    canOpenPullRequest: false
    canRunChecks: false
    canMerge: false
