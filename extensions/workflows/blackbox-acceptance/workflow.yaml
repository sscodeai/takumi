name: blackbox-acceptance
version: 0.1.0
description: >
  Black-box acceptance PoC-1 (zero core change). A natural-language request
  becomes a structured, human-confirmed requirement document; the AI chooses
  language/architecture/stack and implements; the human never reads the design
  or the code; the run ends with a behavioural acceptance harness and a
  delivery manifest.
runtime: fake
requiredSkills:
  - req-intake
steps:
  - id: req_intake
    type: agent
    skill: req-intake
    # First prompt key in extensions/skills/req-intake/manifest.yaml is `intake`.
    # {input} is the request text the CLI was given.
    prompt: "{input}"
  - id: ambiguity_confirmation
    type: approval
    prompt: |
      CONFIRM THE REQUIREMENT DOCUMENT, NOT A STEP NAME.

      The document under confirmation is docs/requirements/poc-blackbox-acceptance.yaml. It carries
      every requirement (REQ-nnn) and every decision the intake found open (AMB-nnn), each with 2-4
      bounded options and, in `chosen`, the option a human decided.

      How the confirmation is recorded (ADR-025): run

        takumi requirement digest docs/requirements/poc-blackbox-acceptance.yaml

      and approve that token. The token is the digest of the document's text, and the acceptance
      step refuses any document that does not hash to it -- so an edit after this confirmation is
      caught by name instead of being accepted quietly.

      Before approving, check:
      1. Every AMB-nnn entry has a `chosen` option that is one of its own listed `options`. The
         acceptance harness FAILS on a document that still carries an undecided decision, so an
         approval of one is an approval of something nobody settled.
      2. Every REQ-nnn has at least one acceptance criterion a third party could check without
         reading the implementation.
      3. The document is the requirement you want built.

      LIMITATION, stated rather than worked around (PoC-2): the engine does not interpolate
      {placeholders} into an approval prompt, and the approval callback returns a boolean over
      three hard-coded options (approve/reject/view). A per-ambiguity bounded-choice UI -- one
      question at a time, with the chosen option written back into the document -- is design
      change 8 and is not in this slice. Today the human decides the options in the document and
      approves its digest.
    dependsOn: [req_intake]
  - id: implementation
    type: agent
    prompt: |
      You are the implementer. The confirmed requirement document is the
      approved content above and the intake artifact at
      .takumi/artifacts/req/req_intake.md. You choose the language,
      architecture and stack. No human will read your design or your code.

      Implement the request end to end in this project directory, following the
      confirmed requirement document and the chosen options for every AMB-nnn
      entry. Write the real source files, not a plan. When done, summarise the
      files you created, the stack you chose and why, and how each acceptance
      criterion is met.
    dependsOn: [ambiguity_confirmation]
  - id: unit_and_integration_tests
    type: agent
    prompt: |
      Write and run unit and integration tests for the implementation from the
      previous step. Cover every acceptance criterion in the confirmed
      requirement document, including the error and boundary behaviour chosen
      for each AMB-nnn entry. Report the exact test command and its result.
    dependsOn: [implementation]
  - id: quality_gate
    type: quality_gate
    # The project's test command. The gate fails closed on a non-zero exit, an
    # unrecognised output shape, a hard-fail marker, failing tests, zero tests,
    # or an all-skipped run.
    prompt: pnpm test
    dependsOn: [unit_and_integration_tests]
    timeoutMs: 600000
  - id: rule_review
    type: rule_review
    # baseRef is required by validateWorkflowManifest. HEAD~1 keeps the change
    # set non-empty; the engine resolves both refs to SHAs before judging.
    baseRef: HEAD~1
    prompt: |
      Deterministic rule review of the delivered change set. Fail closed on a
      block finding, on a human decision, or on a change set that cannot be
      reviewed.
    dependsOn: [quality_gate]
  - id: artifact_acceptance
    # ADR-025: a first-class acceptance step. It is bound to the CONFIRMED requirement document (the
    # human's digest token travels in --confirmed-requirement) and to a harness that is not the
    # implementation's own test. The step fails closed on an edited requirement, on a missing
    # confirmation, and on a missing/failing ACCEPT_VERDICT marker; only a passing verdict writes the
    # ACCEPT artifact.
    type: acceptance
    requirementRef: docs/requirements/poc-blackbox-acceptance.yaml
    acceptanceRef: extensions/workflows/blackbox-acceptance/checks/acceptance-tap.sh
    dependsOn: [rule_review]
    timeoutMs: 120000
  - id: delivery
    type: delivery
    prompt: Package the run's artifacts into a delivery manifest.
    dependsOn: [artifact_acceptance]
