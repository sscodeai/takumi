name: request-to-delivery-attempt
version: 0.2.0
description: >
  ONE delivery attempt: a CONFIRMED requirement document becomes a runnable, judged delivery. The
  implementer chooses language/architecture/stack and no human reads the design or the code; the project's
  own tests are a smoke gate, the judge is FORGED from the document's deliverable contract (ADR-026/028),
  and only a passing acceptance produces evidence. Run by a `repair` step, once per attempt: the second
  attempt is told exactly which checks the first one failed (ADR-034).
runtime: pi
steps:
  - id: ci_config
    # The host's pipeline, written into the DELIVERY before the implementer commits (ADR-037). Order matters:
    # takumi never commits — the agent's boundary IS the commit — so a pipeline written after that commit
    # would be an uncommitted file the host never runs. The test command is a discovery snippet so the
    # pipeline runs the DELIVERED project's own tests whatever stack the implementer chooses, never takumi's;
    # and a `ci_config` whose step declares no test command is refused rather than written as decoration.
    # The created pipeline file is a protected path the deterministic reviewer reports as a note inside the
    # delivery (ADR-032) — see the `rules.protectedPaths` on `rule_review` below for the forgejo path.
    type: ci_config
    testCommand: |
      if [ -f package.json ]; then pnpm test 2>&1 | tail -60;
      elif [ -f run-tests.sh ]; then bash run-tests.sh 2>&1 | tail -60;
      elif ls *.test.mjs >/dev/null 2>&1; then node --test *.test.mjs 2>&1 | tail -60;
      else echo "no test command found in this project" >&2; exit 1; fi
    # The dialect is the DELIVERY HOST's, not this repository's: a run whose `delivery:` section names
    # `provider: github` must write `.github/workflows/ci.yml` or the host never runs it and `await_checks`
    # fails closed. Recorded as a design gap: the dialect should be DERIVED from the delivery provider
    # instead of being written into the workflow. For this run it is set by hand.
    dialect: github
    requirementRef: "{requirement}"
  - id: implementation
    type: agent
    prompt: |
      You are the implementer. The confirmed requirement document is at {requirement} — read it, and
      follow it exactly, including the `deliverable` block: it declares how the thing must be invoked,
      the input world it is about, the exact output line shapes (and what each field of them means), and
      which decisions it settles. You choose the language, architecture and stack; no human will read
      your design or your code.

      A pipeline file has already been written into this directory by the `ci_config` step, in the
      DELIVERY HOST's own dialect: `.github/workflows/ci.yml` for this run (a `provider: github`
      section; a Forgejo/Gitea delivery would be `.forgejo/workflows/ci.yml`). Keep it, and make sure
      your commit includes it. takumi never commits — the host runs what YOU commit — so the delivery
      must be one commit that contains your work AND that pipeline file.

      This is delivery attempt {repairRound}. If the text between the markers below is empty, this is the
      FIRST attempt at this delivery and there is nothing to repair. If it is not empty, a previous
      attempt was REFUSED by an independent judge, and these are the exact checks that failed:

      --- what the judge refused ----------------------------------------------------------------
      {repairFailures}
      ------------------------------------------------------------------------------------------

      Repair the implementation so those checks hold. Judge the FAILURE, not the judge's wording: make
      the behaviour the requirement asks for hold on the whole input world, do not special-case the case
      the message happens to mention, and NEVER weaken, skip or delete a test to make a check pass — the
      deterministic rules review runs again in this same round and will refuse the delivery for it.

      Implement the request end to end in this project directory. Write the real source files, not a
      plan. Satisfy the entry point the requirement names, and honour the option chosen for every AMB-nnn
      entry. When done, summarise the files you created or changed, the stack you chose and why, and how
      each acceptance criterion is met.
    dependsOn: [ci_config]
  - id: unit_and_integration_tests
    type: agent
    prompt: |
      Write and run unit and integration tests for the implementation from the previous step. Cover every
      acceptance criterion in the confirmed requirement document at {requirement}, including the
      behaviour chosen for each AMB-nnn entry. Report the exact test command and its result.

      The run's smoke gate has to be able to RUN your tests, so leave a discoverable entry point: a
      package.json script, or `run-tests.sh` at the project root that runs the suite and exits non-zero on
      failure. A suite nothing can invoke is a suite that does not count. Commit your work: the host runs
      what you commit.
    dependsOn: [implementation]
  - id: quality_gate
    type: quality_gate
    # The project's own test command, run in the implementation. It is a SMOKE gate, not the evidence: a
    # green suite only says the implementer's own tests pass, and the implementer's tests share the
    # implementer's blind spot — which is what the forged judge exists for. It fails closed when the
    # project has no test command at all.
    prompt: |
      if [ -f package.json ]; then pnpm test 2>&1 | tail -60;
      elif [ -f run-tests.sh ]; then bash run-tests.sh 2>&1 | tail -60;
      elif ls *.test.mjs >/dev/null 2>&1; then node --test *.test.mjs 2>&1 | tail -60;
      else echo "no test command found in this project" >&2; exit 1; fi
    dependsOn: [unit_and_integration_tests]
    timeoutMs: 600000
  - id: rule_review
    type: rule_review
    # `root` = the root commit of the repository under review, so the review covers EVERYTHING the
    # delivery added. A distance (`HEAD~1`) would silently review only the commit on top of whatever
    # the implementer happened to leave last.
    baseRef: root
    # The delivery now CREATES a pipeline file (`.forgejo/workflows/ci.yml`) that will judge it. The
    # reviewer's defaults already cover `.github/workflows/`; this ADDS the forgejo/Gitea path so the
    # created pipeline is reported by the SAME protected-path rule (ADR-013) as a note inside the delivery
    # (ADR-032) rather than being silently waved through. A change to a pipeline that already existed still
    # keeps `human` severity and stops the run.
    rules:
      protectedPaths:
        - '(^|/)\.forgejo/workflows/'
    prompt: |
      Deterministic rule review of the delivered change set. Fail closed on a block finding, on a human
      decision, or on a change set that cannot be reviewed.
    dependsOn: [quality_gate]
  - id: judge_forge
    # The document is `{requirement}`: whatever a human confirmed for this run, not a path frozen into
    # this file. The judge is produced HERE, outside the implementation worktree and without reading it.
    type: judge_forge
    requirementRef: "{requirement}"
    forgeRef: extensions/judges/metamorphic-forge.sh
    dependsOn: [rule_review]
    timeoutMs: 120000
  - id: artifact_acceptance
    type: acceptance
    requirementRef: "{requirement}"
    acceptanceRef: "{judgePath}"
    dependsOn: [judge_forge]
    timeoutMs: 120000
