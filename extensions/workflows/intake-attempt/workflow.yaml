name: intake-attempt
version: 0.1.0
description: >
  ONE intake attempt: a natural-language request becomes a structured requirement document, and the
  document's own machine-checked contract is verified BEFORE any human (or signed grant) is asked to
  confirm it. Run by a `repair` step, once per attempt: the second attempt is told exactly which checks the
  first attempt's document failed (ADR-057), which is what turns a bad sample into a repair instead of a
  lost run. Measured 2026-10-12: three of four unattended chains produced a document the gate refused for a
  different reason each time — a missing totals line (docs/bugs-fixed.md #69), six decisions over the
  budget of five (#70) — and every one of them cost the whole run.
runtime: pi
requiredSkills:
  - req-intake
steps:
  # STEP 1: WHICH SHAPE OF ANSWER IS THIS? (ledger #102)
  #
  # Split out because the model could not pick the field model while also writing a 400-line-ruled
  # document. Measured 2026-10-27: given a request for a pass PERCENTAGE, the intake wrote an
  # AGGREGATE document — row-order-invariance + duplicate-resolution alongside ratio fields — three
  # separate times, including after the forge's own refusal named the offending relation in its repair
  # round. Prose in the big prompt did not move it; a SHORT prompt that asks only "aggregate or quotient"
  # answers all three of these requests correctly (verified directly against the API: pass percentage →
  # QUOTIENT, availability → QUOTIENT, total/average salary → AGGREGATE, 190-341 output tokens each).
  #
  # The answer is carried to the next step through `{step.shape_decision}` (the engine records every
  # step's summary into `vars['step.<id>']`), so the document step never has to re-derive it.
  - id: shape_decision
    type: agent
    skill: req-intake
    # The SHORT prompt: `prompts/shape.md` asks only "aggregate or quotient" and is what makes this step
    # cheap (190-341 output tokens measured) and correct where the big prompt was not.
    skillAction: shape
    prompt: |
      {input}
    timeoutMs: 300000
  - id: req_intake
    type: agent
    skill: req-intake
    skillAction: intake
    # `{repairFailures}` is EMPTY on the first attempt and carries the gate's own failing checks on the
    # next one (the engine sets it per attempt). The wording mirrors the delivery's repair prompt: the
    # document is the thing under repair, and the answer is never to weaken the contract.
    prompt: |
      {input}

      STEP 1 OF THIS INTAKE ALREADY DECIDED THE SHAPE OF THE ANSWER. Its decision follows, and it is
      BINDING — do not re-decide it, and do not add relations or fields from the other model:

      --- what step 1 decided ---------------------------------------------------------------
      {step.shape_decision}
      ----------------------------------------------------------------------------------------

      If it says `ANSWER_SHAPE: QUOTIENT`, the per-id line's `fields` must be `[id, numerator,
      denominator, ratio]` and the ONLY relations you may declare are `derived-ratio`,
      `mutation-detection` and at most one scenario. Do NOT declare row-order-invariance, additivity,
      duplicate-resolution, malformed-row-accounting or an independent-aggregation anchor: the forge
      REFUSES that combination by name, because those relations look for counts a ratio line does not
      carry. A skip count, if the request wants one, goes on its own `SKIPPED <n>` line with
      `skipped-count`.

      If it says `ANSWER_SHAPE: AGGREGATE`, use `count`/`sum`/`min`/`max`/`mean` on the per-id line and
      do NOT declare `derived-ratio`.

      IT ALSO DECIDED THE ENTRY POINT, AND `deliverable.run` MUST BE EXACTLY THAT LINE. Step 1's answer
      includes `ENTRY_POINT: bash <name> {csv}`. Copy it into `deliverable.run` verbatim, keeping the
      literal `{csv}` — the judge replaces that with a fixture path. Measured 2026-10-29, three times: a
      document came out with NO `run` at all, so the judge had no way to invoke anything and every run
      died with "the deliverable block declares no run" before a line of code was written. A document
      whose `deliverable` block has no `run`, or a `run` that differs from that line, is not a document.

      This is intake attempt {repairRound}. If the text between the markers below is empty, this is the
      FIRST attempt and there is nothing to repair. If it is not empty, a previous attempt's document was
      REFUSED by the document's own machine-checked contract, and these are the exact checks that failed:

      --- what the contract refused --------------------------------------------------------------
      {repairFailures}
      -------------------------------------------------------------------------------------------

      Repair the DOCUMENT so those checks hold. Fix the document, never the contract: do not drop a real
      question to fit a budget, do not weaken an acceptance criterion, and do not write `chosen:` (the
      confirmation writes those). You are NOT asked to inspect this repository: the document IS the whole
      job.
    # A real runtime is given room to write the document; the fake one returns immediately. The bound
    # stays at 15 minutes so a wandering attempt cannot spend without limit — the repair round, not an
    # unbounded attempt, is what turns a bad sample into a delivery.
    timeoutMs: 900000
    # The document this step MUST write (ADR-053): a file that was already there is not this step's
    # output, so a run whose agent produced nothing fails HERE instead of having the shape gate grade a
    # document from an earlier session.
    produces:
      - docs/requirements/intake.yaml
    dependsOn: [shape_decision]
  - id: intake_shape
    # The document's contract IS this attempt's verdict — a `quality_gate`, not an `acceptance`: an
    # acceptance is bound to a CONFIRMED requirement and nothing is confirmed yet at intake time, so
    # declaring one here failed by construction before the gate could even run (docs/bugs-fixed.md #72).
    # The gate runs the same judge forge the delivery will run (ADR-056) plus the validator the human's
    # confirmation uses, and its failing checks are what the next attempt is told (ADR-057).
    type: quality_gate
    prompt: |
      bash extensions/workflows/request-intake/checks/intake-shape-tap.sh
    dependsOn: [req_intake]
    timeoutMs: 180000
