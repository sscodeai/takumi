name: request-to-delivery
version: 0.1.0
description: >
  The second half of the black-box flow, on its own: a CONFIRMED requirement document becomes a runnable,
  accepted delivery. The implementer chooses language/architecture/stack and no human reads the design or
  the code; the project's own tests are a smoke gate, the judge is FORGED from the document's deliverable
  contract (ADR-026/028), and only a passing acceptance produces a delivery bundle.
runtime: pi
steps:
  - id: implementation
    type: agent
    prompt: |
      You are the implementer. The confirmed requirement document is at {requirement} — read it, and
      follow it exactly, including the `deliverable` block: it declares how the thing must be invoked,
      the exact output line shapes, and which decisions it settles. You choose the language,
      architecture and stack; no human will read your design or your code.

      Implement the request end to end in this project directory. Write the real source files, not a
      plan. Satisfy the entry point the requirement names, and honour the option chosen for every
      AMB-nnn entry. When done, summarise the files you created, the stack you chose and why, and how
      each acceptance criterion is met.
  - id: unit_and_integration_tests
    type: agent
    prompt: |
      Write and run unit and integration tests for the implementation from the previous step. Cover every
      acceptance criterion in the confirmed requirement document at {requirement}, including the
      behaviour chosen for each AMB-nnn entry. Report the exact test command and its result.

      The run's smoke gate has to be able to RUN your tests, so leave a discoverable entry point: a
      package.json script, or `run-tests.sh` at the project root that runs the suite and exits non-zero on
      failure. A suite nothing can invoke is a suite that does not count.
    dependsOn: [implementation]
  - id: quality_gate
    type: quality_gate
    # The project's own test command, run in the implementation. It is a SMOKE gate, not the evidence: a
    # green suite only says the implementer's own tests pass, and the implementer's tests share the
    # implementer's blind spot — which is what the forged judge exists for. It fails closed when the
    # project has no test command at all.
    prompt: |
      if [ -f package.json ]; then pnpm test 2>&1 | tail -60;
      elif [ -f run-tests.sh ]; then bash run-tests.sh 2>&1 | tail -60;
      elif ls *.test.mjs >/dev/null 2>&1; then node --test *.test.mjs 2>&1 | tail -60;
      else echo "no test command found in this project" >&2; exit 1; fi
    dependsOn: [unit_and_integration_tests]
    timeoutMs: 600000
  - id: rule_review
    type: rule_review
    baseRef: HEAD~1
    prompt: |
      Deterministic rule review of the delivered change set. Fail closed on a block finding, on a human
      decision, or on a change set that cannot be reviewed.
    dependsOn: [quality_gate]
  - id: judge_forge
    # The document is `{requirement}`: whatever a human confirmed for this run, not a path frozen into
    # this file. The judge is produced HERE, outside the implementation worktree and without reading it.
    type: judge_forge
    requirementRef: "{requirement}"
    forgeRef: extensions/judges/metamorphic-forge.sh
    dependsOn: [rule_review]
    timeoutMs: 120000
  - id: artifact_acceptance
    type: acceptance
    requirementRef: "{requirement}"
    acceptanceRef: "{judgePath}"
    dependsOn: [judge_forge]
    timeoutMs: 120000
  - id: delivery
    type: delivery
    prompt: Package the run's artifacts into a delivery manifest.
    dependsOn: [artifact_acceptance]
